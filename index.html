const LADDER=[0,1,3,7,14,30,60,120,240];
const MAX_STAGE=LADDER.length-1, MASTER_STAGE=5, LEECH=8;
const clamp=(v,lo,hi)=>Math.min(hi,Math.max(lo,v));
const todayStr=()=>new Date().toLocaleDateString("sv-SE");
const addDays=(d,n)=>{const t=new Date(d+"T00:00:00");t.setDate(t.getDate()+n);return t.toLocaleDateString("sv-SE")};
const daysBetween=(a,b)=>Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5);

function jitter(iv,id){
  if(iv<4) return 0;
  let h=2166136261;
  for(let i=0;i<id.length;i++){h^=id.charCodeAt(i);h=Math.imul(h,16777619);}
  return Math.round(iv*(((h>>>0)%1000)/1000*0.1-0.05));
}
function schedule(p,rating,id){
  let {stage,ease,lapses}=p; const base={...p,tr:p.tr+1};
  if(rating==="again"){
    lapses+=1; ease=clamp(ease-0.2,1.3,2.8); stage=Math.max(0,stage-2);
    return {...base,stage,ease,lapses,iv:1,due:addDays(todayStr(),1),mastered:false,leech:lapses>=LEECH};
  }
  if(rating==="hard") ease=clamp(ease-0.15,1.3,2.8);
  if(rating==="good") stage=clamp(stage+1,0,MAX_STAGE);
  const iv=Math.max(1,Math.round(LADDER[stage]*(ease/2.5)));
  const mastered=stage>=MASTER_STAGE;
  return {...base,stage,ease,iv,cc:p.cc+1,
    due:addDays(todayStr(),Math.max(1,iv+jitter(iv,id))),
    mastered,everM:p.everM||mastered,leech:lapses>=LEECH};
}
const previewStage=(p,r)=>r==="again"?Math.max(0,p.stage-2):r==="hard"?p.stage:clamp(p.stage+1,0,MAX_STAGE);
function previewDays(p,r){
  if(r==="again") return 1;
  const ease=r==="hard"?clamp(p.ease-0.15,1.3,2.8):p.ease;
  return Math.max(1,Math.round(LADDER[previewStage(p,r)]*(ease/2.5)));
}

function parseCards(text){
  const out=[]; let cur=null, mode=null;
  const flush=()=>{
    if(!cur) return;
    const q=cur.q.trim();
    const lines=cur.a.map(s=>s.trim()).filter(Boolean);
    if(q&&lines.length){
      const isEnum=lines.length>1;
      out.push({q,a:lines.join("\n"),type:isEnum?"enum":"fact",n:isEnum?lines.length:0});
    }
    cur=null; mode=null;
  };
  for(const line of text.split("\n")){
    if(/^[ \t]*-{3,}[ \t]*$/.test(line)){ flush(); continue; }
    const qm=line.match(/^[ \t]*Q[:：][ \t]*(.*)$/);
    if(qm){ flush(); cur={q:qm[1],a:[]}; mode="q"; continue; }
    const am=line.match(/^[ \t]*A[:：][ \t]*(.*)$/);
    if(am&&cur){ cur.a.push(am[1]); mode="a"; continue; }
    if(!cur) continue;
    if(mode==="a") cur.a.push(line);
    else if(line.trim()) cur.q+=line.trim();
  }
  flush();
  return out;
}

const HL=/(\[\?\])|([0-9０-９]+(?:[.．][0-9０-９]+)?[%％倍円年月日個回乗番位]?|[①-⑳]|[PpＰｐ]\s?[0-9０-９]+)/g;
function Highlighted({text}){
  const parts=[];let last=0,m,k=0;HL.lastIndex=0;
  while((m=HL.exec(text))!==null){
    if(m.index>last) parts.push(html`<span key=${k++}>${text.slice(last,m.index)}</span>`);
    parts.push(m[1]?html`<mark key=${k++} className="unsure">[?]</mark>`
                   :html`<mark key=${k++} className="numeric">${m[2]}</mark>`);
    last=m.index+m[0].length;
  }
  parts.push(html`<span key=${k++}>${text.slice(last)}</span>`);
  return html`<${React.Fragment}>${parts}<//>`;
}

function Ladder({stage,preview}){
  return html`<div className="nosel">
    <div className="ladder">
      ${LADDER.slice(1).map((d,i)=>{
        const s=i+1,on=s<=stage,cur=s===stage,tgt=preview!=null&&s===preview&&!cur;
        return html`<div className="step" key=${s}>
          <span className=${"pip"+(on?" on":"")+(cur?" cur":"")+(tgt?" tgt":"")}></span>
          <span className=${"lb num"+(cur?" cur":"")}>${d}</span></div>`;
      })}
    </div>
    <div className="between mt8" style=${{fontSize:"11px",color:"#475569"}}>
      <span>間隔（日）</span>
      <span style=${stage>=MASTER_STAGE?{color:"#2dd4bf",fontWeight:600}:{}}>
        ${stage>=MASTER_STAGE?"習得ライン到達":`習得まであと ${MASTER_STAGE-stage} 段`}</span>
    </div></div>`;
}

/* ══════════════════════════════════════════════════════════
   分析
   ══════════════════════════════════════════════════════════ */
function Spark({points,color}){
  if(points.length<2) return null;
  const W=300,H=76,P=5;
  const lo=Math.min(...points)-4,hi=Math.max(...points)+4;
  const xs=points.map((_,i)=>P+i*(W-2*P)/(points.length-1));
  const ys=points.map(v=>H-P-(v-lo)/Math.max(1,hi-lo)*(H-2*P));
  const d=xs.map((x,i)=>`${i?"L":"M"}${x.toFixed(1)} ${ys[i].toFixed(1)}`).join(" ");
  return html`<svg viewBox=${`0 0 ${W} ${H}`} style=${{width:"100%",height:"76px",marginTop:"8px"}}>
    <path d=${d} fill="none" stroke=${color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/>
    ${xs.map((x,i)=>html`<circle key=${i} cx=${x} cy=${ys[i]} r="2.5" fill=${color}/>`)}
  </svg>`;
}

function Stats({st,splitCard}){
  const [days,setDays]=useState(30);
  const t=todayStr();
  const inR=st.logs.filter(l=>daysBetween(l.d,t)<=days);

  const trend=useMemo(()=>{
    const m=new Map();
    inR.forEach(l=>{const v=m.get(l.d)||{n:0,ok:0};v.n++;if(l.ok)v.ok++;m.set(l.d,v);});
    return [...m.entries()].sort().map(([,v])=>Math.round(v.ok/v.n*100));
  },[inR]);

  const ret=useMemo(()=>{
    const m=new Map();
    st.logs.forEach(l=>{if(!l.ivb)return;const v=m.get(l.ivb)||{n:0,ok:0};v.n++;if(l.ok)v.ok++;m.set(l.ivb,v);});
    return [...m.entries()].filter(([,v])=>v.n>=4).map(([iv,v])=>({iv,r:Math.round(v.ok/v.n*100)})).sort((a,b)=>a.iv-b.iv);
  },[st.logs]);

  const byCat=st.cats.map(c=>{
    const ls=inR.filter(l=>l.k===c.id);
    return {...c,n:ls.length,acc:ls.length?Math.round(ls.filter(l=>l.ok).length/ls.length*100):0};
  }).filter(c=>c.n>=3);

  const weak=st.cards.map(c=>({c,p:st.prog[c.id]||newProg()}))
    .filter(x=>x.p.tr>=3&&x.p.cc/x.p.tr<0.6).sort((a,b)=>b.p.lapses-a.p.lapses);

  return html`<div className="pad top" style=${{paddingBottom:"24px"}}>
    <div className="eyebrow">Analytics</div>
    <h2 className="title">分析</h2>
    <div className="row mt16" style=${{gap:"6px"}}>
      ${[7,30,60].map(d=>html`<button key=${d} onClick=${()=>setDays(d)} className="num xs"
        style=${{padding:"6px 14px",borderRadius:"999px",fontWeight:500,
          background:days===d?"var(--ink)":"#f1f5f9",color:days===d?"#fff":"var(--ink2)"}}>${d}日</button>`)}
    </div>

    ${st.logs.length===0?html`<p className="sm faint mt32" style=${{textAlign:"center"}}>復習を数回おこなうと、ここに傾向が出ます。</p>`
    :html`<${React.Fragment}>
      ${trend.length>1?html`<div className="card mt16"><h3>正答率の推移</h3>
        <${Spark} points=${trend} color="#4f46e5"/></div>`:null}

      ${byCat.length>0?html`<div className="card mt16"><h3>カテゴリー別</h3>
        ${byCat.map(c=>html`<div key=${c.id} className="mt12">
          <div className="between xs"><span className="mute">${c.name}</span>
            <b className="num" style=${{color:c.acc<60?"var(--rose)":"var(--ink2)"}}>${c.acc}%</b></div>
          <div className="meter mt4"><div className=${c.acc<60?"bg-rose":"bg-"+tn(c.color)} style=${{width:`${c.acc}%`}}></div></div>
        </div>`)}</div>`:null}

      ${ret.length>1?html`<div className="card mt16">
        <h3>あなたの実測忘却曲線</h3>
        <p className="xs faint">間隔ごとに、実際に思い出せた割合</p>
        <${Spark} points=${ret.map(x=>x.r)} color="#0d9488"/>
        <div className="between num xs faint">${ret.map(x=>html`<span key=${x.iv}>${x.iv}d</span>`)}</div>
      </div>`:null}

      <h3 className="mt24">覚えられていない知識</h3>
      ${weak.length===0?html`<p className="xs faint mt8">正答率が低いカードはありません。</p>`:null}
      ${weak.map(({c,p})=>html`<div className="card mt8" key=${c.id} style=${{padding:"12px"}}>
        <p className="sm" style=${{fontWeight:500}}>${c.q}</p>
        <p className="num xs mute mt4">失敗 ${p.lapses}回 · 正答率 ${Math.round(p.cc/p.tr*100)}%</p>
        ${p.leech&&c.type==="enum"&&c.n>1?html`<div className="sf-amber mt12" style=${{borderRadius:"12px",padding:"10px"}}>
          <p className="xs t-amber">列挙カードで ${p.lapses} 回失敗しています。個別に分けると覚えやすくなります。</p>
          <button className="xs mt8" onClick=${()=>splitCard(c)}
            style=${{background:"#d97706",color:"#fff",padding:"6px 12px",borderRadius:"8px",fontWeight:600,
              display:"flex",alignItems:"center",gap:"6px"}}>
            <span style=${{width:"12px",height:"12px"}}><${Icon} d=${I.cut}/></span>${c.n}枚に分割する</button>
        </div>`:null}
      </div>`)}
    <//>`}
  </div>`;
}

/* ══════════════════════════════════════════════════════════
   設定
   ══════════════════════════════════════════════════════════ */
function Setting({st,update,say}){
  const [nc,setNc]=useState("");const [col,setCol]=useState("indigo");
  const [io,setIo]=useState("");const [showIo,setShowIo]=useState(false);
  const mTotal=Object.values(st.prog).filter(p=>p.everM).length;
  const mNow=Object.values(st.prog).filter(p=>p.mastered).length;

  const doExport=()=>{
    const s=JSON.stringify(st); setIo(s); setShowIo(true);
    if(navigator.clipboard) navigator.clipboard.writeText(s)
      .then(()=>say("コピーしました"),()=>say("下の欄から手動でコピーしてください"));
  };
  const doImport=()=>{
    try{
      const d=JSON.parse(io);
      if(!d.cards||!d.prog) throw new Error();
      update({...blankState(),...d}); say("復元しました"); setShowIo(false);
    }catch{ say("読み込めませんでした"); }
  };

  return html`<div className="pad top" style=${{paddingBottom:"24px"}}>
    <div className="eyebrow">Settings</div>
    <h2 className="title">設定</h2>

    <div className="card mt20">
      <h3>覚えた知識</h3>
      <p className="num t-teal" style=${{fontSize:"34px",fontWeight:600,marginTop:"6px"}}>${mTotal}</p>
      <p className="xs mute mt8">30日間隔（stage 5）を正解で通過したカードを数えています。
        この数は<b>一度到達したら減りません</b>。いま定着しているのは ${mNow} 枚です。</p>
    </div>

    <div className="card mt16">
      <h3>1日の上限</h3>
      <div className="between mt12"><span className="sm mute">復習カード</span>
        <b className="num sm">${st.profile.limit} 枚</b></div>
      <input type="range" min="10" max="200" step="10" value=${st.profile.limit}
        onChange=${e=>update({...st,profile:{...st.profile,limit:Number(e.target.value)}})}
        style=${{width:"100%",marginTop:"8px",accentColor:"var(--indigo)"}}/>
      <p className="xs faint mt8">最初は少なめが続きます。足りなければいつでも増やせます。</p>
    </div>

    <div className="card mt16">
      <h3>カテゴリー</h3>
      <div className="mt12" style=${{display:"flex",flexWrap:"wrap",gap:"8px"}}>
        ${st.cats.map(c=>html`<span key=${c.id} className=${`chip sf-${tn(c.color)} t-${tn(c.color)}`}>
          <span className=${"dot bg-"+tn(c.color)}></span>${c.name}</span>`)}
      </div>
      <div className="row mt12" style=${{gap:"8px"}}>
        <input className="field" style=${{flex:1}} value=${nc} onChange=${e=>setNc(e.target.value)} placeholder="新しいカテゴリー"/>
        <button className="btn sm" style=${{width:"auto",padding:"10px 16px"}} disabled=${!nc.trim()}
          onClick=${()=>{update({...st,cats:[...st.cats,{id:uid(),name:nc.trim(),color:col}]});setNc("");say("追加しました");}}>追加</button>
      </div>
      <div className="row mt8" style=${{gap:"7px"}}>
        ${TONES.map(c=>html`<button key=${c} onClick=${()=>setCol(c)} className=${"bg-"+c}
          style=${{width:"24px",height:"24px",borderRadius:"999px",
            boxShadow:col===c?"0 0 0 2px #fff,0 0 0 4px var(--ink)":"none"}}></button>`)}
      </div>
    </div>

    <div className="card mt16">
      <h3>バックアップ</h3>
      <p className="xs mute mt8">データはこの端末に保存されています。
        書き出したテキストをメモアプリに貼っておくと、機種変更のときも復元できます。</p>
      <div className="row mt12" style=${{gap:"8px"}}>
        <button className="btn sm ghost" onClick=${doExport}>書き出す</button>
        <button className="btn sm ghost" onClick=${()=>setShowIo(!showIo)}>読み込む</button>
      </div>
      ${showIo?html`<${React.Fragment}>
        <textarea className="field mt12" rows="4" value=${io} onChange=${e=>setIo(e.target.value)}
          placeholder="ここにバックアップを貼り付けて「復元する」" style=${{fontSize:"11px"}}></textarea>
        <button className="btn sm mt8" disabled=${!io.trim()} onClick=${doImport}>復元する（いまのデータは置き換わります）</button>
      <//>`:null}
    </div>

    <div className="card mt16">
      <h3>復習の仕組み</h3>
      <p className="xs mute mt8">正解するたびに 1日 → 3日 → 7日 → 14日 → 30日 → 60日 → 120日 と間隔が伸びます。
        「わからない」は2段階戻り、同じセッションの最後にもう一度出ます。
        カードごとの易しさ係数で間隔を ±12% 調整し、復習日が集中しないよう ±5% のゆらぎを入れています。</p>
    </div>

    <button className="btn ghost mt24" style=${{border:"1px solid var(--line)",background:"transparent",color:"var(--mute)",fontSize:"14px"}}
      onClick=${()=>{ if(confirm("すべてのカードと履歴を消します。よろしいですか？")){update(blankState());say("初期化しました");} }}>
      すべて初期化</button>
  </div>`;
}

/* ══════════════════════════════════════════════════════════
   アプリ本体
   ══════════════════════════════════════════════════════════ */
const TABS=[["home","ホーム",I.home],["cards","カード",I.cards],
            ["import","取り込み",I.paste],["stats","分析",I.chart],["set","設定",I.gear]];

function App(){
  const [st,setSt]=useState(()=>loadState()||blankState());
  const [tab,setTab]=useState("home");
  const [session,setSession]=useState(null);
  const [toast,setToast]=useState(null);
  const [saveErr,setSaveErr]=useState(false);
  const [addHome,setAddHome]=useState(false);

  const say=m=>{setToast(m);setTimeout(()=>setToast(null),2200);};
  const update=next=>{ setSt(next); setSaveErr(!saveState(next)); };

  useEffect(()=>{
    const iOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
    const stand=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
    setAddHome(iOS&&!stand);
  },[]);

  const due=useMemo(()=>{
    const t=todayStr();
    return st.cards.filter(c=>(st.prog[c.id]?st.prog[c.id].due:t)<=t).slice(0,st.profile.limit);
  },[st]);

  const answer=rating=>{
    const id=session.queue[session.i];
    const before=st.prog[id]||newProg();
    const after=schedule(before,rating,id);
    const gained=!before.everM&&after.everM?1:0;
    const t=todayStr();
    const pf={...st.profile};
    if(pf.last!==t){
      pf.streak=pf.last===addDays(t,-1)?pf.streak+1:1;
      pf.longest=Math.max(pf.longest,pf.streak);
      pf.last=t;
    }
    const card=st.cards.find(x=>x.id===id);
    update({...st,prog:{...st.prog,[id]:after},profile:pf,
      logs:[...st.logs,{c:id,d:t,ok:rating!=="again",r:rating,ivb:LADDER[before.stage],k:card?card.catId:null}]});

    const last=session.i>=session.queue.length-1&&rating!=="again";
    setSession(s=>({...s,
      queue:rating==="again"?[...s.queue,id]:s.queue,
      i:last?s.i:s.i+1, open:false,
      ok:s.ok+(rating!=="again"?1:0), gained:s.gained+gained, done:last}));
  };

  const addCards=(list,catId)=>{
    const cards=list.map(d=>({id:uid(),catId,q:d.q,a:d.a,type:d.type,n:d.n}));
    const prog={...st.prog}; cards.forEach(c=>{prog[c.id]=newProg();});
    update({...st,cards:[...st.cards,...cards],prog});
    say(`${cards.length}枚を追加しました`);
  };
  const editCard=(id,q,a)=>{
    const lines=a.split("\n").filter(Boolean);
    update({...st,cards:st.cards.map(c=>c.id===id
      ?{...c,q,a,edited:true,type:lines.length>1?"enum":"fact",n:lines.length>1?lines.length:0}:c)});
  };
  const delCard=id=>{
    const prog={...st.prog}; delete prog[id];
    update({...st,cards:st.cards.filter(c=>c.id!==id),prog}); say("削除しました");
  };
  const splitCard=card=>{
    const items=card.a.split("\n").map(s=>s.replace(/^[①-⑳0-9]+[.、)\s]*/,"").trim()).filter(Boolean);
    if(items.length<2) return say("分割できません");
    const topic=card.q.replace(/[0-9０-９]+つは？|[0-9０-９]+要素は？|は？$/g,"").trim();
    const made=items.map(it=>({id:uid(),catId:card.catId,type:"fact",n:0,
      q:`${topic} — 「${it.slice(0,16)}」を説明できますか？`,a:it}));
    const prog={...st.prog}; delete prog[card.id];
    made.forEach(c=>{prog[c.id]=newProg();});
    update({...st,cards:[...st.cards.filter(c=>c.id!==card.id),...made],prog});
    say(`${items.length}枚に分割しました`);
  };
  const start=()=>{
    if(!due.length) return say("今日の復習はありません");
    setSession({queue:due.map(c=>c.id),i:0,open:false,ok:0,gained:0,done:false,t0:Date.now()});
  };

  return html`<div className="app">
    ${saveErr?html`<div className="warn">保存に失敗しました。データが残らない可能性があります。</div>`:null}
    ${addHome?html`<div className="warn" style=${{background:"var(--indigo-soft)",color:"#3730a3"}}>
      共有ボタン → 「ホーム画面に追加」で、アプリとして使えます</div>`:null}

    ${tab==="home"?html`<${Home} st=${st} due=${due} onStart=${start}
      onSeed=${()=>addCards(SAMPLE.map(([q,a,type,n])=>({q,a,type,n})),"c1")}/>`:null}
    ${tab==="cards"?html`<${Cards} st=${st} addCards=${addCards} editCard=${editCard} delCard=${delCard}/>`:null}
    ${tab==="import"?html`<${Import} st=${st} addCards=${addCards} say=${say} onDone=${()=>setTab("home")}/>`:null}
    ${tab==="stats"?html`<${Stats} st=${st} splitCard=${splitCard}/>`:null}
    ${tab==="set"?html`<${Setting} st=${st} update=${update} say=${say}/>`:null}

    <nav className="tabbar">
      ${TABS.map(([id,label,d])=>html`<button key=${id} className=${"tab"+(tab===id?" on":"")}
        onClick=${()=>setTab(id)}>
        <${Icon} d=${d}/><span>${label}</span>
        ${id==="home"&&due.length>0?html`<span className="badge num">${due.length>99?"99+":due.length}</span>`:null}
      </button>`)}
    </nav>

    ${session?html`<${Review} session=${session} setSession=${setSession} st=${st}
      onAnswer=${answer} onEdit=${editCard}
      onClose=${g=>{setSession(null); if(g>0) say(`${g}個の知識を習得しました`);}}/>`:null}

    ${toast?html`<div className="toast">${toast}</div>`:null}
  </div>`;
}

createRoot(document.getElementById("root")).render(html`<${App}/>`);

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
